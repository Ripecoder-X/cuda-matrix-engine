name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up CUDA
      uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d
      with:
        cuda: '12.0.0'
        method: 'local'
        linux-local-args: '["--toolkit"]'

    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-13 g++-13 make cmake

    - name: Configure
      run: |
        cmake --preset linux-debug

    - name: Build
      run: |
        cmake --build --preset linux-debug

    - name: Run tests
      run: |
        ctest --preset linux-debug --output-on-failure
